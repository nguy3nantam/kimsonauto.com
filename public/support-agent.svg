<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Tổng đài viên Kim Sơn">
  <defs>
    <linearGradient id="sa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="sa-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="sa-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <clipPath id="sa-clip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sa-clip)">
    <rect width="200" height="200" fill="url(#sa-bg)"/>
    <circle cx="100" cy="76" r="72" fill="#ffffff" opacity="0.09"/>
    <circle cx="100" cy="100" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>

    <!-- Tóc (lớp sau) -->
    <ellipse cx="100" cy="92" rx="43" ry="47" fill="url(#sa-hair)"/>

    <!-- Cổ -->
    <rect x="87" y="110" width="26" height="38" rx="13" fill="#e9b489"/>

    <!-- Thân / áo sơ mi -->
    <path d="M34 200 C34 157 65 139 100 139 C135 139 166 157 166 200 Z" fill="url(#sa-shirt)"/>
    <path d="M100 139 C135 139 166 157 166 200 L140 200 C140 165 123 147 100 139 Z" fill="#ffffff" opacity="0.08"/>
    <path d="M84 140 C90 154 110 154 116 140 C110 137 90 137 84 140 Z" fill="#0b4f4a"/>

    <!-- Khuôn mặt -->
    <ellipse cx="100" cy="90" rx="33" ry="37" fill="#f7c9a3"/>
    <circle cx="67" cy="93" r="7" fill="#f0bb90"/>
    <circle cx="133" cy="93" r="7" fill="#f0bb90"/>

    <!-- Mái tóc -->
    <path d="M66 87 C59 52 78 40 100 40 C122 40 141 52 134 87 C133 68 124 62 112 66 C104 69 96 69 88 66 C76 62 67 68 66 87 Z" fill="url(#sa-hair)"/>

    <!-- Tai nghe: vành -->
    <path d="M62 84 C62 46 78 29 100 29 C122 29 138 46 138 84" fill="none" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Tai nghe: ốp tai -->
    <rect x="51" y="76" width="17" height="29" rx="8.5" fill="#1e293b"/>
    <rect x="132" y="76" width="17" height="29" rx="8.5" fill="#1e293b"/>
    <rect x="55" y="82" width="9" height="17" rx="4.5" fill="#334155"/>
    <rect x="136" y="82" width="9" height="17" rx="4.5" fill="#334155"/>
    <!-- Mic -->
    <path d="M140 101 C140 119 128 127 114 127" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="113" cy="127" r="5" fill="#1e293b"/>
    <circle cx="112" cy="126" r="1.6" fill="#34d399"/>

    <!-- Mắt -->
    <ellipse cx="88" cy="91" rx="3.3" ry="3.9" fill="#1f2937"/>
    <ellipse cx="112" cy="91" rx="3.3" ry="3.9" fill="#1f2937"/>
    <circle cx="89" cy="90" r="1.1" fill="#ffffff"/>
    <circle cx="113" cy="90" r="1.1" fill="#ffffff"/>
    <!-- Lông mày -->
    <path d="M82 80 Q88 76 94 79" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M106 79 Q112 76 118 80" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <!-- Má hồng -->
    <ellipse cx="79" cy="100" rx="6.5" ry="3.6" fill="#f472b6" opacity="0.35"/>
    <ellipse cx="121" cy="100" rx="6.5" ry="3.6" fill="#f472b6" opacity="0.35"/>
    <!-- Miệng -->
    <path d="M92 106 Q100 113 108 106" fill="none" stroke="#9a3412" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
