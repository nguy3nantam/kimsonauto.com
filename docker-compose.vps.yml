name: kimsonautocom

services:
  web:
    container_name: kimsonauto.com
    build: .
    image: kimsonautocom:latest
    restart: unless-stopped
    volumes:
      - kimsonauto_data:/app/server/data
      - kimsonauto_uploads:/app/server/uploads
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.kimsonautocom.rule=Host(`kimsonauto.com`) || Host(`www.kimsonauto.com`)
      - traefik.http.routers.kimsonautocom.entrypoints=websecure
      - traefik.http.routers.kimsonautocom.tls.certresolver=letsencrypt
      - traefik.http.services.kimsonautocom.loadbalancer.server.port=3000

volumes:
  kimsonauto_data:
  kimsonauto_uploads: